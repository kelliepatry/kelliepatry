name: Refresh KPHD Index card

on:
  schedule:
    - cron: "17 14 * * *" # daily, ~7am Los Angeles
  workflow_dispatch:
  push:
    paths:
      - scripts/build-index-card.mjs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index-card.mjs
      - name: Commit if the card changed
        run: |
          git config user.name "kphd-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kphd-index-card.svg assets/index-card.json
          git diff --cached --quiet || (git commit -m "Refresh KPHD Index card" && git push)
