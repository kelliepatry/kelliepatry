<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">KPHD Index</title>
  <desc id="d">The KPHD Index: 17 projects, 6 place types, 5 stages, 14 Field Notes. Live at kelliepatry.com/index. Updated 2026-11-03.</desc>
  <style>
    .m{font-family:'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .scan{animation:scan 3.2s cubic-bezier(.6,0,.3,1) infinite}
    @keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(560px)}}
    .live{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .dot{fill:#161615;stroke:#A6A6A3;stroke-width:1;animation:dot 15s steps(1,end) infinite}
    @keyframes dot{0%{fill:#F4F4F2;stroke:#F4F4F2}20.00%,100%{fill:#161615;stroke:#A6A6A3}}
    .stg{font-family:'Space Mono','SFMono-Regular',Consolas,monospace;font-size:12px;letter-spacing:2px;fill:#7C7C79;animation:stg 15s steps(1,end) infinite}
    @keyframes stg{0%{fill:#F4F4F2}20.00%,100%{fill:#7C7C79}}
    @media (prefers-reduced-motion:reduce){.scan,.live,.dot,.stg{animation:none}}
  </style>
  <rect width="1200" height="440" fill="#161615"/>
  <rect x="48" y="40" width="1104" height="360" fill="none" stroke="#3A3A38"/>
  <line x1="48" y1="88" x2="1152" y2="88" stroke="#3A3A38"/>
  <text x="72" y="71" class="m" font-size="15" letter-spacing="3.2" fill="#A6A6A3">SHEET IX — KPHD INDEX</text>
  <circle cx="772" cy="66" r="4" fill="#F4F4F2" class="live"/>
  <text x="1128" y="71" text-anchor="end" class="m" font-size="15" letter-spacing="3.2" fill="#7C7C79">LIVE · KELLIEPATRY.COM/INDEX</text>

  <text x="72" y="168" class="m" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#F4F4F2">Every room. Every phase.</text>
  <text x="72" y="222" class="m" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#7C7C79">Every note behind it.</text>

  <svg x="72" y="246" width="520" height="3" overflow="hidden">
    <rect width="520" height="3" fill="#3A3A38"/>
    <rect width="260" height="3" fill="#F4F4F2" class="scan"/>
  </svg>

  <g class="m">
    <text x="72"  y="312" font-size="44" font-weight="700" fill="#F4F4F2">17</text>
    <text x="72"  y="338" font-size="13" letter-spacing="2.6" fill="#A6A6A3">PROJECTS</text>
    <text x="272" y="312" font-size="44" font-weight="700" fill="#F4F4F2">06</text>
    <text x="272" y="338" font-size="13" letter-spacing="2.6" fill="#A6A6A3">PLACE TYPES</text>
    <text x="472" y="312" font-size="44" font-weight="700" fill="#F4F4F2">05</text>
    <text x="472" y="338" font-size="13" letter-spacing="2.6" fill="#A6A6A3">STAGES</text>
    <text x="672" y="312" font-size="44" font-weight="700" fill="#F4F4F2">14</text>
    <text x="672" y="338" font-size="13" letter-spacing="2.6" fill="#A6A6A3">FIELD NOTES</text>
  </g>
  <text x="72" y="380" class="m" font-size="11" letter-spacing="2.2" fill="#7C7C79">UPDATED 2026-11-03 · RECOUNTED DAILY FROM THE LIVE INDEX</text>

  <line x1="880" y1="128" x2="880" y2="352" stroke="#3A3A38"/>
    <circle cx="880" cy="140" r="5" class="dot" style="animation-delay:0s"/>
    <text x="900" y="144" class="stg" style="animation-delay:0s">DISCOVERY</text>
    <circle cx="880" cy="190" r="5" class="dot" style="animation-delay:3s"/>
    <text x="900" y="194" class="stg" style="animation-delay:3s">DESIGN</text>
    <circle cx="880" cy="240" r="5" class="dot" style="animation-delay:6s"/>
    <text x="900" y="244" class="stg" style="animation-delay:6s">DOCUMENTS &#43; PERMITS</text>
    <circle cx="880" cy="290" r="5" class="dot" style="animation-delay:9s"/>
    <text x="900" y="294" class="stg" style="animation-delay:9s">BUILD</text>
    <circle cx="880" cy="340" r="5" class="dot" style="animation-delay:12s"/>
    <text x="900" y="344" class="stg" style="animation-delay:12s">OPENING</text>

  <text x="48" y="428" class="m" font-size="13" letter-spacing="2.6" fill="#7C7C79">COFFEE · BAR · RESTAURANT · HOTEL · RETAIL + SALON · KITCHEN + WORKPLACE</text>
  <text x="1152" y="428" text-anchor="end" class="m" font-size="15" letter-spacing="3.2" fill="#F4F4F2">OPEN THE INDEX  →</text>
</svg>
