<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460"><rect width="1600" height="460" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs><rect x="80" y="150" width="300" height="110" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="230" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="3">BUILT</text><text x="230" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0">builder makes it</text><rect x="460" y="150" width="300" height="110" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="610" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="3">CHECKED</text><text x="610" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0">a different checker passes it</text><rect x="840" y="150" width="300" height="110" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="990" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="3">READY</text><text x="990" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0">for the owner</text><rect x="1220" y="150" width="300" height="110" fill="#111111" stroke="#111111" stroke-width="3"/><text x="1370" y="205" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">RELEASED</text><text x="1370" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#dddddd" text-anchor="middle" letter-spacing="0">owner lets it go live</text><line x1="384" y1="205" x2="456" y2="205" stroke="#111111" stroke-width="3" marker-end="url(#a)"/><line x1="764" y1="205" x2="836" y2="205" stroke="#111111" stroke-width="3" marker-end="url(#a)"/><line x1="1144" y1="205" x2="1216" y2="205" stroke="#111111" stroke-width="3" marker-end="url(#a)"/><text x="80" y="90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="3">TWO KEYS BEFORE ANYTHING GOES LIVE</text><text x="80" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0">the builder never grades its own work</text><path d="M610,262 L610,380 L230,380 L230,266" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/><rect x="300" y="352" width="240" height="56" fill="#ffffff" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 4"/><text x="420" y="386" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="0">fail → new builder</text><text x="625" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0">first key: checker</text><text x="1370" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0">second key: owner</text><line x1="610" y1="300" x2="610" y2="300" stroke="#111111" stroke-width="2"/></svg>