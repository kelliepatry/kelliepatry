g="1" font-weight="normal">HOLD   reason + named owner</text><text x="140" y="534" font-size="13" fill="#7C7C79" text-anchor="start" letter-spacing="0" font-weight="normal">Any station can halt. Work resumes at the affected step only after the owner clears it and evidence and permission are checked again.</text><rect x="131" y="641" width="18" height="18" fill="#161615" stroke="#161615" stroke-width="1.6"/><text x="162" y="655" font-size="14" fill="#161615" text-anchor="start" letter-spacing="0" font-weight="normal">rule (deterministic)</text><rect x="379" y="639" width="22" height="22" fill="url(#hatch)" stroke="#161615" stroke-width="1.6"/><text x="414" y="655" font-size="14" fill="#161615" text-anchor="start" letter-spacing="0" font-weight="normal">model judgment</text><circle cx="610" cy="650" r="10" fill="#C8692E"/><text x="630" y="655" font-size="14" fill="#C8692E" text-anchor="start" letter-spacing="0" font-weight="normal">person</text><rect x="731" y="641" width="18" height="18" fill="#2E8EA3" stroke="#2E8EA3" stroke-width="1.6"/><text x="762" y="655" font-size="14" fill="#2E8EA3" text-anchor="start" letter-spacing="0" font-weight="normal">record</text><text x="1460" y="658" font-size="20" fill="#161615" text-anchor="end" letter-spacing="0" font-weight="normal">1 of 9 stations calls a model.</text><line x1="60" y1="740" x2="1540" y2="740" stroke="#C6C6C3" stroke-width="1"/><text x="60" y="780" font-size="16" fill="#7C7C79" text-anchor="start" letter-spacing="0" font-weight="normal">Proposed sequence; stations show order, not installed automation.</text><text x="1540" y="780" font-size="16" fill="#7C7C79" text-anchor="end" letter-spacing="1"><tspan fill="#C8692E">ROOM</tspan> / <tspan fill="#2E8EA3">RECORD</tspan>  KP × CLAUDE</text></svg>
